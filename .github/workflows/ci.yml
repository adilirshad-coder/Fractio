name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fractio
          POSTGRES_PASSWORD: fractio
          POSTGRES_DB: fractio
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fractio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fractio:fractio@localhost:5432/fractio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-program-id.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p fractio-backend -- --include-ignored

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.avm
            ~/.cache/solana
            ~/.local/share/solana
          key: anchor-solana-2.1.21-anchor-0.31.1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            anchor-solana-2.1.21-anchor-0.31.1-${{ runner.os }}-
      - name: Install Solana CLI 2.1.21
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
      - name: Install AVM and Anchor 0.31.1
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install 0.31.1
          avm use 0.31.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
      - run: anchor --version
      - run: bash scripts/check-program-id.sh
      - run: cargo test -p fractio
      - run: anchor build
