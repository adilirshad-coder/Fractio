services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: fractio, POSTGRES_PASSWORD: fractio, POSTGRES_DB: fractio }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fractio"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
